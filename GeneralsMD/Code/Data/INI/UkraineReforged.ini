; Zero Hour Reforged's Ukraine faction, loaded after FixesReforged.ini with INI_LOAD_MULTIFILE.
; Every Ukraine object is a unique ObjectReskin of an America template so AI scripts and
; ThingFactory::newObject map 1-to-1 cleanly.
;
; This file lands in the multiplayer INI checksum.

Locomotor UkraineBohdanaLocomotor
  Surfaces            = GROUND
  Speed               = 50
  SpeedDamaged        = 35
  TurnRate            = 180
  TurnRateDamaged     = 120
  Acceleration        = 1000
  AccelerationDamaged = 1000
  Braking             = 1000
  MinTurnSpeed        = 0
  ZAxisBehavior       = NO_Z_MOTIVE_FORCE
  Appearance          = TREADS
  AccelerationPitchLimit = 5
  DecelerationPitchLimit = 5
  PitchStiffness      = 0.05
  RollStiffness       = 0.025
  PitchDamping        = 0.8
  RollDamping         = 0.3
  ForwardAccelerationPitchFactor = 0.3
  LateralAccelerationRollFactor  = 0.3
End

