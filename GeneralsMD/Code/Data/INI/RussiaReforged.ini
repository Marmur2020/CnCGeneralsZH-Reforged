; Zero Hour Reforged's Russia faction, loaded after UkraineReforged.ini with INI_LOAD_MULTIFILE.
; Every Russia object is a unique ObjectReskin of a China template so AI scripts and
; ThingFactory::newObject map 1-to-1 cleanly.
;
; This file lands in the multiplayer INI checksum.

; ==== Buildings ===================================================================================

ObjectReskin RussiaCommandCenter ChinaCommandCenter
End

Object RussiaCommandCenter
  Side        = Russia
  DisplayName = OBJECT:RussiaCommandCenter
  CommandSet  = RussiaCommandCenterCommandSet
  AddModule
    Behavior = RadarCoverageBehavior ModuleTag_RussiaRadarCoverage
      Radius          = 600
      RadiusUpgrade   = Upgrade_RussiaEarlyWarning 1.25
      ClassifyUpgrade = Upgrade_RussiaTargetClassification
    End
  End
  AddModule
    Behavior = MaxHealthUpgrade ModuleTag_RussiaFortification
      TriggeredBy  = Upgrade_RussiaFortification
      AddMaxHealth = 1250.0
      ChangeType   = ADD_CURRENT_HEALTH_TOO
    End
  End
  RemoveModule ModuleTag_17
  RemoveModule ModuleTag_18
  RemoveModule ModuleTag_19
  RemoveModule ModuleTag_22Tank_Fix
  RemoveModule ModuleTag_22Nuke_Fix
  AddModule
    Behavior = OCLSpecialPower ModuleTag_RussiaOrlanRecon
      SpecialPowerTemplate = SuperweaponRussiaOrlanRecon
      OCL                  = SUPERWEAPON_RussiaOrlanRecon
      CreateLocation       = CREATE_AT_LOCATION
    End
  End
  AddModule
    Behavior = SwarmStrikeSpecialPower ModuleTag_RussiaLancetSwarm
      SpecialPowerTemplate = SuperweaponRussiaLancetSwarm
      Radius               = 200
      TargetCount          = 1
      UpgradeTargetCount   = SCIENCE_RussiaLancetSwarm3 5
      UpgradeTargetCount   = SCIENCE_RussiaLancetSwarm2 3
      Weapon               = RussiaSwarmMunitionWeapon
      TargetFX             = WeaponFX_ComancheAntiTankMissileDetonation
    End
  End
  AddModule
    Behavior = RadarJamSpecialPower ModuleTag_RussiaElectronicWarfare
      SpecialPowerTemplate = SuperweaponRussiaElectronicWarfare
      Radius               = 300
      Duration             = 30000
      FX                   = WeaponFX_EMPPulseImpact
      OCL                  = SUPERWEAPON_RussiaElectronicWarfare
    End
  End
  AddModule
    Behavior = OCLSpecialPower ModuleTag_RussiaVdvDrop
      SpecialPowerTemplate = SuperweaponRussiaVdvDrop
      UpgradeOCL           = SCIENCE_RussiaVdvDrop3 SUPERWEAPON_RussiaVdvDrop3
      UpgradeOCL           = SCIENCE_RussiaVdvDrop2 SUPERWEAPON_RussiaVdvDrop2
      OCL                  = SUPERWEAPON_RussiaVdvDrop
      CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
      OCLAdjustPositionToPassable = Yes
    End
  End
  AddModule
    Behavior = OCLSpecialPower ModuleTag_RussiaGlonassGuidance
      SpecialPowerTemplate = SuperweaponRussiaGlonassGuidance
      OCL                  = SUPERWEAPON_RussiaGlonassGuidance
      CreateLocation       = CREATE_AT_LOCATION
    End
  End
  AddModule
    Behavior = OCLSpecialPower ModuleTag_RussiaIskanderStrike
      SpecialPowerTemplate = SuperweaponRussiaIskanderStrike
      OCL                  = SUPERWEAPON_RussiaIskanderStrike
      CreateLocation       = CREATE_AT_LOCATION
    End
  End
  AddModule
    Behavior = OCLSpecialPower ModuleTag_RussiaSpetsnazRaid
      SpecialPowerTemplate = SuperweaponRussiaSpetsnazRaid
      OCL                  = SUPERWEAPON_RussiaSpetsnazRaid
      CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
      OCLAdjustPositionToPassable = Yes
    End
  End
End

