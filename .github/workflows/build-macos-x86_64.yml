name: Build macOS x86_64 (12.0+)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-macos-x86_64.yml'
      - 'GeneralsMD/Code/**'

concurrency:
  group: build-macos-x86_64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-macos-x86_64:
    runs-on: macos-15-intel
    env:
      CCACHE_MAXSIZE: 1G
      CCACHE_SLOPPINESS: pch_defines,time_macros
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          command -v cmake >/dev/null 2>&1 || brew install cmake
          command -v ninja >/dev/null 2>&1 || brew install ninja
          command -v ccache >/dev/null 2>&1 || brew install ccache
          echo "CCACHE_DIR=${RUNNER_TEMP}/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: macos-15-intel-ccache-${{ hashFiles('GeneralsMD/Code/Tools/vendor.sh', 'GeneralsMD/Code/CMakeLists.txt') }}-${{ github.run_id }}
          restore-keys: |
            macos-15-intel-ccache-${{ hashFiles('GeneralsMD/Code/Tools/vendor.sh', 'GeneralsMD/Code/CMakeLists.txt') }}-
            macos-15-intel-ccache-

      - name: Fetch vendored sources
        env:
          ZHR_NO_ADDONS: '1'
        run: ./GeneralsMD/Code/Tools/vendor.sh

      - name: Configure CMake (macOS x86_64, 12.0)
        run: |
          ccache --zero-stats
          cmake -S GeneralsMD/Code -B build-mac-x86_64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON

      - name: Build generals, overlay, and macOS app bundle
        run: |
          cmake --build build-mac-x86_64 --target generals zh_overlay macos_app
          ccache --show-stats

      - name: Verify x86_64 binary and macOS 12.0 deployment target
        run: |
          APP="build-mac-x86_64/Zero Hour Reforged.app"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/generals")"
          echo "Architectures: $ARCHS"
          [ "$ARCHS" = "x86_64" ]
          otool -arch x86_64 -l "$APP/Contents/MacOS/generals" | grep -A 3 LC_BUILD_VERSION
          MINOS="$(otool -arch x86_64 -l "$APP/Contents/MacOS/generals" | awk '/LC_BUILD_VERSION/ {f=1} f && $1 == "minos" {print $2; exit}')"
          echo "Minimum macOS: $MINOS"
          [ "$MINOS" = "12.0" ]
          codesign --verify --deep --strict "$APP"

      - name: Package app bundle
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "build-mac-x86_64/Zero Hour Reforged.app" "dist/Zero-Hour-Reforged-macOS-x86_64-12.0.zip"
          ditto -c -k --sequesterRsrc --keepParent "build-mac-x86_64/Zero Hour Reforged.app.dSYM" "dist/Zero-Hour-Reforged-macOS-x86_64-12.0.dSYM.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zero-Hour-Reforged-macOS-x86_64-12.0
          path: dist/*.zip
