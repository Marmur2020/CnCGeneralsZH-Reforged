name: Build Windows x64

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run headless ctest suite'
        type: boolean
        default: true
      no_addons:
        description: 'Skip downloading optional HD art add-ons (ZHR_NO_ADDONS=1)'
        type: boolean
        default: true
  push:
    paths:
      - '.github/workflows/build-windows-x64.yml'
      - 'GeneralsMD/Code/**'
      - 'build.bat'

concurrency:
  group: build-windows-x64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch vendored sources
        timeout-minutes: 10
        shell: pwsh
        env:
          ZHR_NO_ADDONS: ${{ (github.event_name != 'workflow_dispatch' || inputs.no_addons) && '1' || '0' }}
        run: ./GeneralsMD/Code/Tools/vendor.ps1

      - name: Configure CMake (Windows x64)
        shell: pwsh
        run: cmake -S GeneralsMD/Code -B build64 -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build build64 --config Release --parallel

      - name: Run headless tests (ctest)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        shell: pwsh
        run: |
          $exclude = "test_milesaudiomanager|miles_smoke|test_miles_miniaudio|test_binkvideo|bink_smoke|dx9_smoke|dx9_smoke_msaa|test_dx11device"
          ctest --test-dir build64 -C Release -j 4 --timeout 900 --output-on-failure -E $exclude

      - name: Verify and package Windows build
        shell: pwsh
        run: |
          $runDir = "GeneralsMD/Run"
          $required = @(
            "generals.exe",
            "BrowserEngine.dll",
            "avcodec-62.dll",
            "avformat-62.dll",
            "avutil-60.dll",
            "swresample-6.dll",
            "swscale-9.dll"
          )
          foreach ($f in $required) {
            $path = Join-Path $runDir $f
            if (-not (Test-Path $path)) {
              throw "Missing required runtime file: $path"
            }
          }

          $stage = "dist/stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem -LiteralPath $runDir -Force | Where-Object {
            $_.Name -ne "Cinema" -and $_.Extension -ne ".pdb"
          } | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $stage -Recurse -Force
          }

          Compress-Archive -Path "$stage/*" -DestinationPath "dist/Zero-Hour-Reforged-Windows-x64.zip" -Force
          Remove-Item -Recurse -Force $stage

          $pdb = Join-Path $runDir "generals.pdb"
          if (Test-Path $pdb) {
            Compress-Archive -Path $pdb -DestinationPath "dist/Zero-Hour-Reforged-Windows-x64.pdb.zip" -Force
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zero-Hour-Reforged-Windows-x64
          path: dist/*.zip
